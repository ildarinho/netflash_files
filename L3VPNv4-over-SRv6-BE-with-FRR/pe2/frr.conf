frr version 10.2.1_git
frr defaults traditional
hostname pe2
!
ip prefix-list inbound-bgp seq 10 permit 2.2.2.2/32
ip prefix-list outbound-bgp seq 10 permit 1.1.1.1/32
!
vrf vrf-ce
 vni 10
exit-vrf
!
interface eth1
 ipv6 address 2001:db8:20::1/64
 ipv6 router isis 12
exit
!
interface eth2
 ip address 10.2.2.1/31
exit
!
interface lo
 description test
 ipv6 address be::2/128
 ipv6 router isis 12
exit
!
router bgp 12 vrf vrf-ce
 bgp router-id 22.22.22.22
 no bgp default ipv4-unicast
 no bgp network import-check
 neighbor ce-peer peer-group
 neighbor ce-peer remote-as 2
 neighbor 10.2.2.0 peer-group ce-peer
 !
 address-family ipv4 unicast
  neighbor ce-peer activate
  neighbor ce-peer route-map inbound-bgp-map in
  neighbor ce-peer route-map outbound-bgp-map out
  sid vpn export auto
  rd vpn export 12:2
  nexthop vpn export 2001:db8:200::
  rt vpn both 12:1
  export vpn
  import vpn
 exit-address-family
exit
!
router bgp 12
 neighbor PE peer-group
 neighbor PE remote-as internal
 neighbor PE update-source be::2
 neighbor PE capability extended-nexthop
 neighbor be::1 peer-group PE
 !
 segment-routing srv6
  locator locator-name
 exit
 !
 address-family ipv4 unicast
  no neighbor PE activate
 exit-address-family
 !
 address-family ipv4 vpn
  neighbor PE activate
  neighbor PE next-hop-self
  neighbor PE soft-reconfiguration inbound
 exit-address-family
exit
!
router isis 12
 is-type level-2-only
 net 49.0012.0000.0000.0002.00
 topology ipv6-unicast
 segment-routing srv6
  locator locator-name
 exit
exit
!
route-map inbound-bgp-map permit 10
 match ip address prefix-list inbound-bgp
exit
!
route-map outbound-bgp-map permit 10
 match ip address prefix-list outbound-bgp
exit
!
segment-routing
 srv6
  encapsulation
   source-address be::2
  locators
   locator locator-name
    prefix 2001:db8:200::/64 block-len 40 node-len 24 func-bits 16
   exit
   !
  exit
  !
  formats
   format usid-f3216
   exit
   !
   format uncompressed-f4024
   exit
   !
  exit
  !
 exit
 !
exit
!
