frr version 10.1.2_git
frr defaults traditional
hostname ce1
no ipv6 forwarding
!
ip prefix-list red-to-bgp seq 5 permit 1.1.1.1/32
ip prefix-list inbound-bgp seq 10 permit 2.2.2.2/32
!
interface eth1
 ip address 10.1.1.0/31
exit
!
interface lo
 description test
 ip address 1.1.1.1/32
exit
!
router bgp 1
 bgp router-id 1.1.1.1
 no bgp network import-check
 neighbor 10.1.1.1 remote-as 12
 !
 address-family ipv4 unicast
  redistribute connected route-map red-to-bgp-map
  neighbor 10.1.1.1 route-map inbound-bgp-map in
  neighbor 10.1.1.1 route-map red-to-bgp-map out
 exit-address-family
exit
!
route-map red-to-bgp-map permit 10
 match ip address prefix-list red-to-bgp
exit
!
route-map inbound-bgp-map permit 10
 match ip address prefix-list inbound-bgp
exit
!

